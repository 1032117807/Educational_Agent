[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-learning-desktop"
version = "1.0.0"
description = "完全本地运行的个性化学习助手"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<6.9",
  "SQLAlchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["langchain-text-splitters>=1.0,<2.0", "pytest>=8", "pytest-qt>=4.4"]
build = ["Nuitka==2.5.1"]
ocr = [
  "paddleocr>=3.5,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q -p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["app*"]
