[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-learning-desktop"
version = "1.0.0"
description = "完全本地运行的个性化学习助手"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<6.9",
  "SQLAlchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "alembic>=1.13",
  "langchain-core>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langchain-chroma>=1.0,<2.0",
  "langchain-text-splitters>=1.0,<2.0",
  "fastembed>=0.8,<1.0",
  "chromadb>=1.0,<2.0",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "jieba>=0.42,<1.0",
  "mcp>=1.0,<2.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pgvector>=0.3,<1.0",
  "boto3>=1.35,<2.0",
  "redis>=5.0,<7.0",
  "python-multipart>=0.0.9,<1.0",
  "PyJWT>=2.9,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]
build = ["PyInstaller==6.11.1"]
ocr = [
  "paddleocr>=3.5,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q -p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["app*", "ai*", "server*"]
