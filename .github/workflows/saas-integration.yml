name: SaaS Infrastructure Integration

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docker-compose.saas.yml"
      - "docker/**"
      - "migrations/**"
      - "scripts/grant_saas_runtime_role.py"
      - "scripts/verify_saas_integration.py"
      - "server/**"
      - "app/**"
      - "ai/**"
      - "pyproject.toml"
      - ".github/workflows/saas-integration.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run full regression suite
        run: python -m pytest -q

  verify-saas-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      POSTGRES_PASSWORD: ci-migration-password-not-for-production
      APP_DB_USER: learning_app
      APP_DB_PASSWORD: ci-runtime-password-not-for-production
      REDIS_PASSWORD: ci-redis-password-not-for-production
      OBJECT_STORAGE_ACCESS_KEY: learning-ci
      OBJECT_STORAGE_SECRET_KEY: ci-minio-secret-not-for-production
      CORS_ORIGINS: https://ci.example.test
      TZ: Asia/Shanghai
      LEARNING_AI_ENABLED: "false"
      LEARNING_AI_EMBEDDING_LOCAL_FILES_ONLY: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Create runtime environment file
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          APP_ENV=production
          SECRET_KEY=ci-only-secret-key-with-at-least-32-characters
          POSTGRES_PASSWORD=ci-migration-password-not-for-production
          APP_DB_USER=learning_app
          APP_DB_PASSWORD=ci-runtime-password-not-for-production
          REDIS_PASSWORD=ci-redis-password-not-for-production
          REDIS_URL=redis://:ci-redis-password-not-for-production@redis:6379/0
          DATABASE_URL=postgresql+psycopg://learning_app:ci-runtime-password-not-for-production@postgres:5432/learning
          OBJECT_STORAGE_ACCESS_KEY=learning-ci
          OBJECT_STORAGE_SECRET_KEY=ci-minio-secret-not-for-production
          CORS_ORIGINS=https://ci.example.test
          DEPLOYMENT_DOMAIN=ci.example.test
          CADDY_ACME_EMAIL=ci@example.test
          TZ=Asia/Shanghai
          LEARNING_AI_ENABLED=false
          LEARNING_AI_EMBEDDING_LOCAL_FILES_ONLY=false
          EOF

      - name: Validate production environment shape
        run: python scripts/validate_production_env.py --env-file .env

      - name: Build and start SaaS services
        run: docker compose -f docker-compose.saas.yml up -d --build

      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready" >&2
          exit 1

      - name: Verify PostgreSQL pgvector and RLS isolation
        run: |
          docker compose -f docker-compose.saas.yml exec -T \
            -e DATABASE_URL="postgresql+psycopg://learning:${POSTGRES_PASSWORD}@postgres:5432/learning" \
            -e APP_DB_USER="${APP_DB_USER}" \
            api python scripts/verify_saas_integration.py

      - name: Verify HTTP security headers
        run: python scripts/verify_http_security.py --base-url http://127.0.0.1:8000

      - name: Run disposable learning-loop smoke test
        run: python scripts/smoke_test_saas.py --base-url http://127.0.0.1:8000

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.saas.yml logs --no-color

      - name: Stop SaaS services
        if: always()
        run: docker compose -f docker-compose.saas.yml down -v --remove-orphans
