<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Personalized learning workflow</title>
  <desc id="desc">Goal, research, indexed materials, practice, daily tasks, and feedback form a learning loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5fbff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#245" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2474b8"/></marker>
    <style>.box{fill:#fff;stroke:#b9d4ea;stroke-width:2;filter:url(#shadow)}.t{font:700 19px Arial,'Microsoft YaHei',sans-serif;fill:#123452}.s{font:14px Arial,'Microsoft YaHei',sans-serif;fill:#53718a}.line{stroke:#2474b8;stroke-width:3;marker-end:url(#arrow)}.tag{font:700 13px Arial,'Microsoft YaHei',sans-serif;fill:#1673b8}</style>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <text x="60" y="55" class="tag">PERSONALIZED LEARNING LOOP</text>
  <text x="60" y="88" class="t">从学习目标到下一轮个性化计划</text>
  <g transform="translate(55 135)">
    <rect class="box" width="170" height="115" rx="16"/><text class="t" x="24" y="43">学习目标</text><text class="s" x="24" y="70">课程 · 截止日期</text><text class="s" x="24" y="92">每周学习时间</text>
    <line class="line" x1="185" y1="57" x2="230" y2="57"/>
    <rect class="box" x="245" width="170" height="115" rx="16"/><text class="t" x="269" y="43">资料检索</text><text class="s" x="269" y="70">筛选学习资料</text><text class="s" x="269" y="92">确认后导入</text>
    <line class="line" x1="430" y1="57" x2="475" y2="57"/>
    <rect class="box" x="490" width="170" height="115" rx="16"/><text class="t" x="514" y="43">RAG 索引</text><text class="s" x="514" y="70">课程知识库</text><text class="s" x="514" y="92">可引用证据</text>
    <line class="line" x1="675" y1="57" x2="720" y2="57"/>
    <rect class="box" x="735" width="170" height="115" rx="16"/><text class="t" x="759" y="43">练习与任务</text><text class="s" x="759" y="70">出题 · 每日计划</text><text class="s" x="759" y="92">直接作答</text>
    <line class="line" x1="920" y1="57" x2="965" y2="57"/>
    <rect class="box" x="980" width="170" height="115" rx="16"/><text class="t" x="1004" y="43">反馈优化</text><text class="s" x="1004" y="70">错题 · 复习</text><text class="s" x="1004" y="92">掌握度更新</text>
  </g>
  <path d="M1130 275 C1010 315 210 315 85 275" fill="none" stroke="#8ab8dc" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
</svg>
