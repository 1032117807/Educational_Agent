services:
  api:
    build:
      context: .
      dockerfile: docker/saas/Dockerfile
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-learning_app}:${APP_DB_PASSWORD:-replace-with-a-runtime-password}@postgres:5432/learning
      REDIS_URL: redis://:${REDIS_PASSWORD:-replace-with-a-redis-password}@redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: learning
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-learning-admin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-replace-with-a-long-minio-password}
      LEARNING_AI_EMBEDDING_LOCAL_FILES_ONLY: "false"
    command: python -m uvicorn server.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/saas/Dockerfile
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-learning_app}:${APP_DB_PASSWORD:-replace-with-a-runtime-password}@postgres:5432/learning
      REDIS_URL: redis://:${REDIS_PASSWORD:-replace-with-a-redis-password}@redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: learning
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-learning-admin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-replace-with-a-long-minio-password}
      LEARNING_AI_EMBEDDING_LOCAL_FILES_ONLY: "false"
    command: python -m server.run_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  agent-sandbox:
    build:
      context: .
      dockerfile: docker/agent-sandbox/Dockerfile
    image: personal_learning_desktop-agent-sandbox:latest
    command: ["-I", "-c", "import time; time.sleep(86400)"]
    network_mode: none
    read_only: true
    mem_limit: 128m
    pids_limit: 64
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: docker/saas/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://learning:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/learning
      MIGRATION_DATABASE_URL: postgresql+psycopg://learning:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/learning
      APP_DB_USER: ${APP_DB_USER:-learning_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-replace-with-a-runtime-password}
    command: /bin/sh -c "python -m alembic upgrade head && python scripts/grant_saas_runtime_role.py"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: learning
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      APP_DB_USER: ${APP_DB_USER:-learning_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-replace-with-a-runtime-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/20-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d learning"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-replace-with-a-redis-password}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-replace-with-a-redis-password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a '$${REDIS_PASSWORD:-replace-with-a-redis-password}' ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-learning-admin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-replace-with-a-long-minio-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${OBJECT_STORAGE_ACCESS_KEY:-learning-admin} $${OBJECT_STORAGE_SECRET_KEY:-replace-with-a-long-minio-password} && mc mb --ignore-existing local/learning"
    environment:
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-learning-admin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-replace-with-a-long-minio-password}

volumes:
  postgres_data:
  redis_data:
  minio_data:
